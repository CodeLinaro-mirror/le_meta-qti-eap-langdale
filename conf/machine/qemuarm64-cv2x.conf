require conf/machine/qemuarm64.conf

# This variable is used to indicate the prebuilt binaries
# distribution that needs to be used for this machine.
# Options are:
# eap-imx: 32-bit ARM, Telematics
# eap-imx64: 64-bit ARM, Telematics
# eap-imx-cv2x: 32-bit ARM, CV2X
# eap-imx64-cv2x: 64-bit ARM, CV2X
TARGET = "eap-imx64-cv2x"

MACHINE_FEATURES += "cv2x cv2x-only"
MACHINEOVERRIDES =. "cv2x:qemuarm64:"

# Variable required by the linux-yocto recipe
# to choose which kernel machine to build.
# This machine only has user space changes from
# qemuarm64, so we can reuse qemuarm64 kernel
# configuration
KMACHINE = "qemuarm64"
