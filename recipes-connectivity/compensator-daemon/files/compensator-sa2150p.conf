#Config items for sa2150p platform
PrxPonGPIO = 84
DrxPonGPIO = 85
AntennaBreakPwrGPIO = 36
PrxUartName=/dev/ttyHS1
DrxUartName=/dev/ttyHS0
BaudRate = 115200

#PrxActive: compensator is connected on Prx
#DrxActive: compensator is connected on Drx
PrxActive = true
DrxActive = true

#Modem is operating at HB, MB or LB
Band = HB

#Normal mission mode config file
MissionModeConfigFile = v2x.xml

#mission mode config file, but disabled Tx diversity, use antenna 0 only for Tx
MissionModeConfigFilePrx = v2x_antenna0.xml
#mission mode config file, but disabled Tx diversity, use antenna 1 only for Tx
MissionModeConfigFileDrx = v2x_antenna1.xml

#config file used for CLM
TrainingModeConfigFile = v2x_clm.xml

#command used for CLM
TrainingCommand = acme -W 8,4,1,0 -l 700 -k 10

#Specify if compensator should be powered off under certain condition.
StopOnTemperatureLimit = false
StopOnCableLossLimit = false
StopOnPowerLowLimit = false
StopOnPowerHighLimit = false
